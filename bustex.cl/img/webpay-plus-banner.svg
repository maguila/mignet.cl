<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#C01118"/>
    </linearGradient>
  </defs>

  <!-- Card Background Container -->
  <rect width="540" height="190" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- Top Title Banner -->
  <g transform="translate(270, 30)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" font-style="italic">
      <tspan fill="#1D4ED8">¡Ahora puedes pagar con </tspan>
      <tspan fill="#ED1C24">RedCompra!</tspan>
    </text>
  </g>

  <!-- Red Dotted Accent Line -->
  <g transform="translate(40, 38)">
    <line x1="0" y1="0" x2="460" y2="0" stroke="#ED1C24" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  </g>

  <!-- Webpay Plus Main Logo -->
  <g transform="translate(150, 48)">
    <!-- webpay text -->
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#1E293B" letter-spacing="-1.5">webpay</text>
    <!-- plus badge -->
    <rect x="138" y="6" width="60" height="32" rx="7" fill="url(#redGrad)"/>
    <text x="168" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">plus</text>
  </g>

  <!-- Payment Cards Horizontal Grid -->
  <g transform="translate(22, 98)">
    <!-- 1. VISA -->
    <g transform="translate(0, 0)">
      <rect width="72" height="34" rx="4" fill="#1A1F71"/>
      <text x="36" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VISA</text>
      <path d="M48,23 L58,23" stroke="#F7B600" stroke-width="2.5"/>
    </g>

    <!-- 2. Mastercard -->
    <g transform="translate(79, 0)">
      <rect width="72" height="34" rx="4" fill="#111111"/>
      <circle cx="30" cy="17" r="11" fill="#EB001B"/>
      <circle cx="42" cy="17" r="11" fill="#F79E1B" fill-opacity="0.85"/>
    </g>

    <!-- 3. MAGNA -->
    <g transform="translate(158, 0)">
      <rect width="72" height="34" rx="4" fill="#002F6C"/>
      <text x="36" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">MAGNA</text>
    </g>

    <!-- 4. American Express -->
    <g transform="translate(237, 0)">
      <rect width="72" height="34" rx="4" fill="#006FCF"/>
      <text x="36" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">AMERICAN</text>
      <text x="36" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">EXPRESS</text>
    </g>

    <!-- 5. Diners Club -->
    <g transform="translate(316, 0)">
      <rect width="72" height="34" rx="4" fill="#004A97"/>
      <circle cx="25" cy="17" r="9" fill="#FFFFFF"/>
      <line x1="25" y1="8" x2="25" y2="26" stroke="#004A97" stroke-width="2.5"/>
      <text x="48" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">Diners Club</text>
      <text x="48" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">INTERNATIONAL</text>
    </g>

    <!-- 6. Redcompra -->
    <g transform="translate(395, 0)">
      <rect width="100" height="34" rx="4" fill="#1A1F71"/>
      <rect x="3" y="3" width="94" height="13" fill="#ED1C24" rx="2"/>
      <text x="50" y="13" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle">Red</text>
      <text x="50" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle">compra</text>
    </g>
  </g>

  <!-- Red Dotted Accent Line Bottom -->
  <g transform="translate(40, 148)">
    <line x1="0" y1="0" x2="460" y2="0" stroke="#ED1C24" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  </g>

  <!-- Footer Transbank Logo -->
  <g transform="translate(415, 172)">
    <!-- Asterisk logo -->
    <g transform="translate(-14, -10)">
      <path d="M6,0 L6,12 M0,6 L12,6 M1.8,1.8 L10.2,10.2 M1.8,10.2 L10.2,1.8" stroke="#ED1C24" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ED1C24" letter-spacing="-0.5">transbank<tspan fill="#ED1C24">.</tspan></text>
  </g>
</svg>

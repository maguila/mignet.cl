<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>mignet.cl — Proyectos y Servicios</title>
  <meta name="description" content="Portal principal de mignet.cl con acceso directo a Bustex y Tarifario Taxis Futrono.">
  <style>
    :root {
      color-scheme: light dark;

      --bg-light: #f5f7fa;
      --bg-dark: #0f1419;
      --surface-light: #ffffff;
      --surface-dark: #182028;
      --text-light: #111827;
      --text-dark: #f3f4f6;
      --muted-light: #4b5563;
      --muted-dark: #9ca3af;
      --border-light: #e5e7eb;
      --border-dark: #2a3441;
      --accent-light: #0f62fe;
      --accent-dark: #6ea8fe;

      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --border: var(--border-light);
      --accent: var(--accent-light);

      @media (prefers-color-scheme: dark) {
        --bg: var(--bg-dark);
        --surface: var(--surface-dark);
        --text: var(--text-dark);
        --muted: var(--muted-dark);
        --border: var(--border-dark);
        --accent: var(--accent-dark);
      }

      @supports (color: light-dark(white, black)) {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
      }

      --radius: 14px;
      --space-sm: 0.75rem;
      --space-md: 1.5rem;
      --space-lg: 2.5rem;
    }

    html {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      accent-color: var(--accent);
    }

    body {
      margin: 0;
      min-block-size: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header,
    main,
    footer {
      inline-size: min(100% - 2rem, 56rem);
      margin-inline: auto;
    }

    header {
      padding-block: var(--space-lg) var(--space-md);
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    main {
      padding-block: var(--space-sm) var(--space-lg);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
      gap: var(--space-md);
      align-items: start;
    }

    .card-link {
      display: block;
      color: inherit;
      text-decoration: none;
      border-radius: var(--radius);

      &:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
    }

    .card {
      box-sizing: border-box;
      display: grid;
      gap: var(--space-sm);
      padding: var(--space-md);
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: transform 0.16s ease, border-color 0.16s ease;
    }

    .card-link:hover .card {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-icon {
      inline-size: 2.25rem;
      block-size: 2.25rem;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--accent);
      background-color: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .card h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card-cta {
      margin-block-start: 0.25rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent);
    }

    footer {
      padding-block: var(--space-md);
      border-block-start: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>mignet.cl</h1>
    <p class="subtitle">Accesos directos a proyectos web alojados en este servidor.</p>
  </header>

  <main>
    <section class="projects-grid" aria-label="Proyectos disponibles">
      <a class="card-link" href="./bustex.cl/">
        <article class="card">
          <div class="card-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="14" rx="2"></rect>
              <path d="M7 21h10"></path>
              <path d="M12 18v3"></path>
            </svg>
          </div>
          <h2>Comercial Bustex</h2>
          <p>Sitio web y sistema de cotizaciones alojado en <code>/bustex.cl</code>.</p>
          <span class="card-cta">Ir a Bustex →</span>
        </article>
      </a>

      <a class="card-link" href="./taxis/">
        <article class="card">
          <div class="card-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 17h14v-5l-2-5H7L5 12z"></path>
              <circle cx="7.5" cy="17.5" r="1.5"></circle>
              <circle cx="16.5" cy="17.5" r="1.5"></circle>
            </svg>
          </div>
          <h2>Taxis Futrono</h2>
          <p>Consulta rápida de tarifas y destinos disponible en <code>/taxis</code>.</p>
          <span class="card-cta">Ir a Taxis →</span>
        </article>
      </a>
    </section>
  </main>

  <footer>
    mignet.cl
  </footer>
</body>

</html>
